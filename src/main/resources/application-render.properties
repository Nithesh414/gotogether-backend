spring.application.name=gotogether

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

app.emailjs.service-id=${APP_EMAILJS_SERVICE_ID}
app.emailjs.template-id=${APP_EMAILJS_TEMPLATE_ID}
app.emailjs.public-key=${APP_EMAILJS_PUBLIC_KEY}
app.emailjs.private-key=${APP_EMAILJS_PRIVATE_KEY:}

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
